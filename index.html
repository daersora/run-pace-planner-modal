<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run Pace Planner</title>
    <link rel="stylesheet" href="simple-plan.css" />
    <script src="simple-plan.js" defer></script>
  </head>
  <body>
    <!-- GRAND TOTALS SUMMARY -->
    <!-- TODO: Enter Time and Distance Goal Trackers -->
    <!-- TODOD: Add in save to save to localstorage -->
    <div class="pace-planner">
      <section class="totals-card">
        <h3 class="totals-card__title">Total</h3>
        <div class="totals-card__details">
          <span class="totals-card__item" data-role="total-time"></span>
          <span class="totals-card__item" data-role="total-pace"></span>
          <span class="totals-card__item" data-role="total-distance"></span>
          <button
            class="btn btn--reset btn--icon btn--secondary"
            id="reset-plan-button"
            data-role="reset-plan"
          >
            <span class="icon-reset">↺</span>
          </button>
        </div>
        <div class="target-and-progress">
          <div class="target-inputs">
            <label for="distance-goal">Target Distance (km) </label
            ><input
              type="number"
              name="distance-goal"
              id="distance-goal-input"
              min="1"
              max="50"
              step="0.1"
            />
            <span data-role="distance-selection" id="distance-selectors">
              <button class="btn btn--secondary btn--text" id="5km-goal">
                5km
              </button>
              <button class="btn btn--secondary btn--text" id="10km-goal">
                10km
              </button>
              <button class="btn btn--secondary btn--text" id="half-goal">
                Half Marathon
              </button>
              <button class="btn btn--secondary btn--text" id="full-goal">
                Marathon
              </button>
            </span>
          </div>
          <div class="totals-card__progress">
            <div class="progress-bar-container">
              <div class="progress-bar">
                <div
                  class="progress-bar__fill"
                  id="distance-progress-fill"
                ></div>
              </div>
              <span id="distance-progress-label">0%</span>
            </div>
          </div>
        </div>
      </section>
      <!-- MAIN CONTAINER FOR SEGMENT CARDS -->

      <main class="segment-list" id="segment-list">
        <!-- POPULATES ON PAGE LOAD -->
      </main>
    </div>
    <!-- ACTIONS -->
    <button
      id="add-segment-button"
      class="btn btn--primary btn--text"
      data-role="add-segment"
    >
      Add New Segment
    </button>
    <!-- DEBUG CONVERTER -->
    <!-- <div class="debug" style="display: none">
      <input type="number" id="second-converter" data-role="debug-input" />
      <span id="second-converted" data-role="debug-output"></span>
    </div> -->
    <template id="tpl-segment-card">
      <!-- SEGMENT CARD TEMPLATE -->
      <!-- TODO: Add in Segment Type Run/Walk, Run, Walk -->
      <article class="segment-card" data-role="segment">
        <header class="segment-card__header">
          <h3 class="segment-card__title" data-role="segment-title">
            Segment 1
          </h3>
          <!-- HEADER SUMMARY -->
          <div
            class="segment-card__header-summary"
            data-role="header-summary"
          ></div>
          <!-- SEGMENT TYPE SELECT -->
          <div
            class="segment-card__segment-type-select"
            data-role="segment-type-select"
          >
            <span>Segment Type:</span
            ><select name="" id="segment-type-selector">
              <option value="run-walk">Run/Walk</option>
              <option value="run-only">Run</option>
              <option value="walk-only">Walk</option>
            </select>
          </div>
          <!-- CARD COLLAPSE TOGGLE -->
          <button
            class="btn btn--secondary segment-card__toggle-btn btn--icon"
            data-role="close-card"
            aria-label="Toggle segment details"
          >
            <span class="icon-caret" data-role="toggle-icon">▾</span>
          </button>
        </header>
        <div class="segment-card__intervals">
          <!-- RUNNING INTERVAL BLOCK -->
          <section
            class="interval-block interval-block--run"
            data-interval="run"
          >
            <h4 class="interval-block__title">Running</h4>
            <!-- TIME -->
            <div class="control-group" data-control-type="time">
              <label class="control-group__label">Time</label>
              <input
                type="range"
                min="60"
                max="300"
                step="15"
                value="150"
                class="control-group__slider"
                data-role="slider"
                aria-label="Run Time"
              />
              <span class="control-group__output" data-role="output"></span>
            </div>
            <!-- PACE -->
            <div class="control-group" data-control-type="pace">
              <label class="control-group__label">Pace</label>
              <input
                type="range"
                min="300"
                max="600"
                step="15"
                value="450"
                class="control-group__slider"
                data-role="slider"
                aria-label="Run Pace"
              />
              <span class="control-group__output" data-role="output"></span>
            </div>
            <!-- DISTANCE -->
            <span class="interval-block__distance" data-role="distance"></span>
          </section>
          <!-- WALKING INTERVAL BLOCK -->
          <section
            class="interval-block interval-block--walk"
            data-interval="walk"
          >
            <h4 class="interval-block__title">Walking</h4>
            <!-- TIME -->
            <div class="control-group" data-control-type="time">
              <label class="control-group__label">Time</label>
              <input
                type="range"
                min="60"
                max="300"
                step="15"
                value="150"
                class="control-group__slider"
                data-role="slider"
                aria-label="Walk Time"
              />
              <span class="control-group__output" data-role="output"></span>
            </div>
            <!-- PACE -->
            <div class="control-group" data-control-type="pace">
              <label class="control-group__label">Pace</label>
              <input
                type="range"
                min="600"
                max="900"
                step="15"
                value="750"
                class="control-group__slider"
                data-role="slider"
                aria-label="Walk Pace"
              />
              <span class="control-group__output" data-role="output"></span>
            </div>
            <!-- DISTANCE -->
            <span class="interval-block__distance" data-role="distance"></span>
          </section>
        </div>
        <!-- REPEAT SUMMARY & ACTIONS -->
        <footer class="segment-card__summary">
          <div class="segment-card__summary-controls">
            <span class="segment-card__repeat-summary"
              >Repeats : 05:00 | 09:22 min/km | 2.67 km</span
            >
            <!-- REPEAT CONTROL -->
            <div class="control-group" data-control-type="repeat">
              <input
                type="range"
                min="1"
                max="40"
                step="1"
                value="5"
                class="control-group__slider"
                data-role="slider"
                aria-label="Segment Repeats"
              />
              <span class="control-group__output" data-role="output"></span>
            </div>
            <button
              class="btn segment-card__remove-btn btn--icon"
              data-role="delete-row"
              disabled
            >
              X
            </button>
          </div>
        </footer>
      </article>
    </template>
  </body>
</html>
